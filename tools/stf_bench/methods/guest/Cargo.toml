[package]
name = "stf_bench_guest"
version = "0.1.0"
edition = "2024"
license = { workspace = true }
publish = false

# BIP340 batch verification, shared by the bins and testable on the host.
[lib]
path = "src/batch.rs"

# Whole state in, SHA-256 of its borsh encoding before and after.
[[bin]]
name = "stf_block"
path = "src/bin/flat.rs"

# Touched public accounts in, compact sparse Merkle root before and after.
[[bin]]
name = "stf_block_merkle"
path = "src/bin/merkle.rs"

# Authorizes one signer: knows the secret whose SHA-256 is the public key.
[[bin]]
name = "auth"
path = "src/bin/auth.rs"

[dependencies]
chain_state = { path = "../../../../lez/chain_state", default-features = false }
common.workspace = true
lee.workspace = true
lee_core.workspace = true
stf_smt = { path = "../../smt" }

borsh.workspace = true
k256 = { workspace = true, features = ["schnorr"] }
risc0-zkvm = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "zkvm")'.dependencies]
risc0-bigint2 = "1.4.14"
