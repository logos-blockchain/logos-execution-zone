# Config file reference can be found at https://embarkstudios.github.io/cargo-deny/checks/cfg.html.

[graph]
all-features = true
exclude-dev = true
no-default-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Marvin Attack: potential key recovery through timing sidechannels" },
  { id = "RUSTSEC-2024-0388", reason = "`derivative` is unmaintained; consider using an alternative. Use `cargo tree -p derivative -i > tmp.txt` to check the dependency tree." },
  { id = "RUSTSEC-2024-0436", reason = "`paste` has a security vulnerability; consider using an alternative. Use `cargo tree -p paste -i > tmp.txt` to check the dependency tree." },
  { id = "RUSTSEC-2025-0055", reason = "`tracing-subscriber` v0.2.25 pulled in transitively by ark-relations v0.4.0; the fix requires ark-relations to upgrade to tracing-subscriber >=0.3.20. Tracked in #321." },
  { id = "RUSTSEC-2025-0141", reason = "`bincode` is permanently unmaintained; alternatives are postcard, bitcode, rkyv. Migration tracked in #321." },
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is pulled transitively via risc0-zkvm; waiting on upstream fix (see https://github.com/risc0/risc0/issues/3453)" },
  { id = "RUSTSEC-2026-0118", reason = "`hickory-proto` v0.25.0-alpha.5 is present transitively from logos crates, modification may break integration" },
  { id = "RUSTSEC-2026-0119", reason = "`hickory-proto` v0.25.0-alpha.5 is present transitively from logos crates, modification may break integration" },
  { id = "RUSTSEC-2026-0194", reason = "`quick-xml` v0.31 is pulled transitively by Cucumber's JUnit report writer; this path only serializes XML with `quick_xml::Writer` and does not exercise the vulnerable XML parsing APIs" },
  { id = "RUSTSEC-2026-0195", reason = "`quick-xml` v0.31 is pulled transitively by Cucumber's JUnit report writer; this path only serializes XML and does not use the vulnerable `NsReader` namespace parsing path" },

  { id = "RUSTSEC-2026-0173", reason = "`proc-macro-error2` is unmaintained; pulled in transitively via `leptos_macro` and `overwatch-derive`, waiting on upstream fix" },
  { id = "RUSTSEC-2024-0449", reason = "`unsafe-libyaml` unmaintained, pulled in by the logos crates" },
  { id = "RUSTSEC-2026-0344", reason = "`ruzstd` reached only through `object` under `risc0-zkvm`" },
  { id = "RUSTSEC-2026-0367", reason = "`zip` 2.4.2 reached only through `risc0-circuit-recursion`, which reads its embedded archive in memory and never calls the vulnerable `extract`" },
  { id = "RUSTSEC-2026-0368", reason = "`zip` 2.4.2 reached only through `risc0-circuit-recursion`, which reads its embedded archive in memory and never calls the vulnerable `extract`" },
  { id = "RUSTSEC-2026-0369", reason = "`zip` 2.4.2 reached only through `risc0-circuit-recursion`, which reads its embedded archive in memory and never calls the vulnerable `extract`" },
  { id = "RUSTSEC-2026-0387", reason = "Two copies. `crypto-bigint` 0.5.5 is reached through `elliptic-curve` 0.13.8 under the `k256` 0.13 this workspace requires, and `elliptic-curve` 0.13.8 requires `crypto-bigint ^0.5`, so the only fix is migrating to `k256` 0.14. The 0.7.5 copy under `keycard-rs` is fixed by a bump that also moves `ctutils`, see RUSTSEC-2026-0385." },
  { id = "RUSTSEC-2026-0385", reason = "`ctutils` 0.4.2 reaches guest code through `hybrid-array` under `ml-kem` and `chacha20` in `lee_core`, so bumping it rewrites constant-time primitives compiled into the privacy circuit and every builtin program and moves their image ids. That belongs in a change about image ids, not in a dependency bump." },
  { crate = "crypto-bigint@0.7.5", reason = "Yanked upstream. Clearing it means the same bump that moves `ctutils` into the guests, see RUSTSEC-2026-0385." },
]
yanked = "deny"
unused-ignored-advisory = "warn"

[bans]
allow-wildcard-paths = false
multiple-versions = "allow"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BlueOak-1.0.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # TEMP: Pending legal review. Pulled transitively via `risc0-zkvm`
  { name = "downloader", version = "0.2.8", allow = ["LGPL-3.0-or-later"] },
  { name = "malachite", version = "0.4.22", allow = ["LGPL-3.0-only"] },
  { name = "malachite-base", version = "0.4.22", allow = ["LGPL-3.0-only"] },
  { name = "malachite-float", version = "0.4.22", allow = ["LGPL-3.0-only"] },
  { name = "malachite-nz", version = "0.4.22", allow = ["LGPL-3.0-only"] },
  { name = "malachite-q", version = "0.4.22", allow = ["LGPL-3.0-only"] },
  { name = "managed", version = "0.8.0", allow = ["0BSD"] },

  # enum-iterator
  { name = "enum-iterator", version = "2.3.0", allow = ["0BSD"] },
  { name = "enum-iterator-derive", version = "1.5.0", allow = ["0BSD"] },
]
private = { ignore = false }
unused-allowed-license = "deny"

[sources]
allow-git = [
  "https://github.com/EspressoSystems/jellyfish.git",
  "https://github.com/logos-blockchain/logos-blockchain.git",
  "https://github.com/logos-blockchain/logos-blockchain-circuits.git",
  "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git",
  "https://github.com/logos-blockchain/logos-blockchain-testing.git",
  "https://github.com/logos-blockchain/sponges",
  "https://github.com/arkworks-rs/spongefish.git",
  "https://github.com/keycard-tech/keycard-rs",
]
unknown-git = "deny"
unknown-registry = "deny"

[sources.allow-org]
github = ["logos-co"]
