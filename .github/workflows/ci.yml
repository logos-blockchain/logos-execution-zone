on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "!.github/workflows/*.yml"

  # No path filter: `ci-ok` must report on docs-only PRs too.
  pull_request:

# Supersede in-progress runs for a pull request; never cancel a push, so each
# merge to main/dev keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  packages: read

name: General

jobs:
  # Gating `ci-image` alone skips the rest: every costly job chains through it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Detect non-documentation changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"

          # An empty list means the API told us nothing, so assume code.
          if [[ -n "$files" && -z "$(sed '/\.md$/d' <<< "$files")" ]]; then
            echo "Documentation-only pull request; skipping the code jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  ci-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  bedrock-node:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Cargo-authoritative Bedrock node
        uses: ./.github/actions/resolve-bedrock-node
        with:
          image: ${{ needs.ci-image.outputs.image }}
          target_platform: linux-x86_64

      - name: Upload resolved Bedrock node
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-node
          path: bedrock/.resolved
          include-hidden-files: true
          if-no-files-found: error

  cucumber:
    needs: [ci-image, bedrock-node]
    uses: ./.github/workflows/cucumber-integration-tests.yml
    with:
      image: ${{ needs.ci-image.outputs.image }}
    permissions:
      contents: read
      packages: read
    # Must not cancel pushes: every merge shares `github.ref` on a push.
    concurrency:
      group: cucumber-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

  bedrock-resolver-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Test Bedrock resolver and live release contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_LIVE_RELEASE_TESTS: "1"
        run: python3 bedrock/tools/test_resolve_bedrock_node.py -v

      - name: Test integration test target discovery
        run: python3 .github/scripts/test_discover_integration_test_targets.py -v

  fmt-rs:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Check Rust files are formatted
        # Toolchain pinned in .github/docker/ci.Dockerfile; keep the two in sync.
        run: cargo +nightly-2026-10-08 fmt --check

  fmt-toml:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      # No path argument: taplo reads a `.` as a literal file, excludes it for
      # not being a .toml, and checks nothing.
      - name: Check TOML files are formatted
        run: taplo fmt --check

  machete:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Check for unused dependencies
        run: cargo machete

  deny:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Check licenses, bans and sources
        run: cargo deny --locked check licenses bans sources

      # By severity, not by code: a code list misses the ones hardcoded to
      # error. Only a fetch failure is absorbed, since nothing can demote it.
      - name: Report advisories
        run: |
          set -o pipefail
          cargo deny fetch db || exit 0
          cargo deny --locked check advisories -W denied 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60

    name: lint
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-container-tests
          # Read-only; `unit-tests` is the only writer.
          save-if: false

      - name: Lint workspace
        env:
          RISC0_SKIP_BUILD: "1"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint programs
        env:
          RISC0_SKIP_BUILD: "1"
        run: cargo clippy -p "*program" -- -D warnings

  unit-tests:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-container-tests
          # Only writer of this cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Run tests
        env:
          RISC0_DEV_MODE: "1"
          RUST_LOG: "info,kameo=warn"
        run: cargo nextest run --profile ci --workspace --exclude integration_tests --exclude test_fixtures --all-features

  # Not a `container:` job: the tests drive the host's Docker daemon through
  # testcontainers, so they run in the CI image via `run-in-ci-image` instead.
  test-fixtures-tests:
    needs: [ci-image, bedrock-node]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin host toolchain
        uses: ./.github/actions/pin-host-toolchain
      - name: Download resolved Bedrock node
        uses: actions/download-artifact@v5
        with:
          name: bedrock-node
          path: bedrock/.resolved

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-host-prebuild-nodebug
          # Read-only; prebuild is the only writer.
          save-if: false

      - name: Run test_fixtures tests
        uses: ./.github/actions/run-in-ci-image
        with:
          image: ${{ needs.ci-image.outputs.image }}
          env: |
            RISC0_DEV_MODE=1
            RUST_LOG=info,kameo=warn
            CARGO_PROFILE_DEV_DEBUG=0
            CARGO_PROFILE_TEST_DEBUG=0
          run: cargo nextest run -p test_fixtures

  abort-on-stale-fixtures:
    needs: test-fixtures-tests
    # `failure()` would also fire for an unrelated ancestor failure.
    if: needs.test-fixtures-tests.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # No checkout in this job, so `gh` cannot infer the repo from git.
      - run: gh run cancel ${{ github.run_id }} -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  # Not a `container:` job: the test binaries bake CARGO_MANIFEST_DIR in at
  # compile time, so the archive has to be built on the same path the matrix
  # jobs later run it from.
  integration-tests-prebuild:
    needs: ci-image
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.discover-targets.outputs.targets }}
      archive_mib: ${{ steps.archive-size.outputs.mib }}
      test_binaries: ${{ steps.archive-size.outputs.binaries }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin host toolchain
        uses: ./.github/actions/pin-host-toolchain

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # The suffix tracks the debug level: this action cannot see the
          # container's environment, so a change without a rename never saves.
          shared-key: ci-host-prebuild-nodebug
          # Only writer of this cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Build integration test archive
        uses: ./.github/actions/run-in-ci-image
        with:
          image: ${{ needs.ci-image.outputs.image }}
          # One pair per line; a single line makes the whole string the
          # first variable's value.
          env: |
            RISC0_DEV_MODE=1
            CARGO_PROFILE_DEV_DEBUG=0
            CARGO_PROFILE_TEST_DEBUG=0
          # Listed from the build just archived: unpacking the archive again
          # overflows the runner's disk.
          run: |
              source .github/scripts/with_retry.sh
              with_retry 'cargo nextest archive -p integration_tests --archive-file integration-tests.tar.zst --no-pager' 2
              cargo nextest list -p integration_tests \
                --message-format json \
                --no-pager > integration-tests-binaries.json

      - name: Measure the archive
        id: archive-size
        run: |
          mib="$(du -m integration-tests.tar.zst | cut -f1)"
          binaries="$(jq '[.["rust-suites"][] | select(.kind == "test")] | length' \
            integration-tests-binaries.json)"

          echo "mib=$mib" >> "$GITHUB_OUTPUT"
          echo "binaries=$binaries" >> "$GITHUB_OUTPUT"
          echo "Archive $mib MiB across $binaries test binaries."

      - name: Upload integration test archive
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-archive
          path: integration-tests.tar.zst

      # $GITHUB_OUTPUT is outside the mounted workspace, so the container cannot
      # write to it. Discover targets on the runner from the full nextest test
      # inventory so binaries containing only ignored tests are not scheduled.
      - name: Discover integration test targets from archive
        id: discover-targets
        run: |
          targets_json="$(python3 .github/scripts/discover_integration_test_targets.py integration-tests-binaries.json)"

          if [[ "$targets_json" == "[]" ]]; then
            echo "No integration test targets were discovered." >&2
            exit 1
          fi

          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"
          echo "Discovered integration targets: $targets_json"

  # Every shard downloads the whole archive, so its size is paid once per
  # shard. Its own job so a regression reports without skipping those shards.
  archive-size-budget:
    needs: integration-tests-prebuild
    runs-on: ubuntu-latest
    env:
      BUDGET_MIB: 4400
    steps:
      - name: Compare the archive against its budget
        run: |
          mib="${{ needs.integration-tests-prebuild.outputs.archive_mib }}"
          binaries="${{ needs.integration-tests-prebuild.outputs.test_binaries }}"

          # An empty output would be 0 to `((` and pass silently.
          if ! [[ "$mib" =~ ^[0-9]+$ ]]; then
            echo "::error::The prebuild reported no archive size (got '$mib')."
            exit 1
          fi

          {
            echo "### Integration test archive"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| size | ${mib} MiB |"
            echo "| budget | ${BUDGET_MIB} MiB |"
            echo "| test binaries | ${binaries} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( mib > BUDGET_MIB )); then
            echo "::error::The integration test archive is ${mib} MiB, over the ${BUDGET_MIB} MiB budget. Each of the ${binaries} test targets statically links the whole workspace, so a new one costs ~80 MiB on every shard's download. Grouping tests as modules of an existing target costs nothing. If the growth is intended, raise BUDGET_MIB in ci.yml."
            exit 1
          fi

          echo "Archive ${mib} MiB across ${binaries} test binaries, within the ${BUDGET_MIB} MiB budget."

  integration-tests:
    needs: [ci-image, bedrock-node, integration-tests-prebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.integration-tests-prebuild.outputs.targets) }}
    name: integration-tests (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `download-artifact` can return a truncated file and still succeed, so
      # verify before the corrupt stream surfaces as a test failure.
      - name: Download integration test archive
        id: archive
        timeout-minutes: 12
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: integration-tests-archive

      - name: Verify the archive
        id: verify
        continue-on-error: true
        run: zstd -t integration-tests.tar.zst

      - name: Discard a bad archive
        if: steps.archive.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: rm -f integration-tests.tar.zst

      - name: Download integration test archive, second attempt
        if: steps.archive.outcome == 'failure' || steps.verify.outcome == 'failure'
        timeout-minutes: 20
        uses: actions/download-artifact@v5
        with:
          name: integration-tests-archive

      - name: Verify the archive after the second attempt
        if: steps.archive.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: zstd -t integration-tests.tar.zst

      - name: Download resolved Bedrock node
        timeout-minutes: 20
        uses: actions/download-artifact@v5
        with:
          name: bedrock-node
          path: bedrock/.resolved

      - name: Make resolved Bedrock node executable
        run: chmod +x bedrock/.resolved/logos-blockchain-node

      # A shard that runs out of room reports only "error writing file to disk".
      - name: Report disk headroom before extraction
        run: |
          ls -l --block-size=M integration-tests.tar.zst
          zstd -l integration-tests.tar.zst
          df -h / /tmp /mnt || true

      - name: Run tests
        uses: ./.github/actions/run-in-ci-image
        with:
          image: ${{ needs.ci-image.outputs.image }}
          env: |
            RISC0_DEV_MODE=1
            RUST_LOG=info,kameo=warn
            LOGOS_BLOCKCHAIN_NODE_BIN=${{ github.workspace }}/bedrock/.resolved/logos-blockchain-node
          run: |
            # A `binary::test` target is one test alone on this runner.
            target='${{ matrix.target }}'
            binary="${target%%::*}"
            if [[ "$target" == *::* ]]; then
              filter="binary($binary) and test(=${target#*::})"
            else
              filter="binary($binary)"
            fi

            # Four attempts as before, but inside nextest, which names the
            # flaky test and reruns only it rather than the whole command.
            if [[ "$binary" == "tf_bedrock_builder" || \
                  "$binary" == "tf_app_deployments" ]]; then
              # The nextest archive contains the absolute Cargo git checkout
              # path compiled into the Logos testing framework. This is a fresh
              # runner, so materialize the pinned Logos checkout again before
              # allowing TF to use its local build provider.
              cargo fetch --locked

              env -u GITHUB_ACTIONS -u CI cargo nextest run --retries 3 \
                --archive-file integration-tests.tar.zst -E "$filter"
            else
              cargo nextest run --retries 3 \
                --archive-file integration-tests.tar.zst -E "$filter"
            fi

      - name: Report disk headroom after the tests
        if: always()
        run: df -h / /tmp /mnt || true
  # `just build-artifacts` drives the host's Docker daemon via `cargo risczero
  # build`, so it goes through the image rather than `container:`.
  artifacts:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: artifacts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin host toolchain
        uses: ./.github/actions/pin-host-toolchain

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-host-prebuild-nodebug
          # Read-only; prebuild is the only writer.
          save-if: false

      - name: Build artifacts
        uses: ./.github/actions/run-in-ci-image
        with:
          image: ${{ needs.ci-image.outputs.image }}
          run: just build-artifacts

      - name: Check if artifacts match repository
        run: |
          if ! git diff --exit-code artifacts/; then
            echo "❌ Artifacts in the repository are out of date!"
            echo "Please run 'just build-artifacts' and commit the changes."
            exit 1
          fi
          echo "✅ Artifacts are up to date"

  # The dashboard generator is plain Rust (no Docker), so this runs directly in
  # the CI image container rather than through `run-in-ci-image`.
  dashboards:
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30

    name: dashboards
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.head_ref }}

      - name: Regenerate dashboards
        run: just regenerate-dashboards

      - name: Check if dashboards match repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code monitoring/grafana/dashboards/; then
            echo "❌ Dashboards in the repository are out of date!"
            echo "Please run 'just regenerate-dashboards' and commit the changes."
            exit 1
          fi
          echo "✅ Dashboards are up to date"

  # The one required status check: `always()` so it reports even when `changes`
  # skipped everything. A skipped job reports nothing and would block forever.
  ci-ok:
    if: always()
    needs:
      - changes
      - ci-image
      - bedrock-node
      - cucumber
      - bedrock-resolver-tests
      - fmt-rs
      - fmt-toml
      - machete
      - deny
      - lint
      - unit-tests
      - test-fixtures-tests
      - integration-tests-prebuild
      - archive-size-budget
      - integration-tests
      - artifacts
      - dashboards
    runs-on: ubuntu-latest
    steps:
      # Skipped is a pass; everything else, cancelled included, fails.
      - name: Require every job to have succeeded or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(jq -r 'to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | .[] | "\(.key): \(.value.result)"' <<< "$NEEDS")"

          if [[ -n "$bad" ]]; then
            echo "::error::CI is not green:"
            echo "$bad"
            exit 1
          fi

          echo "Every job succeeded or was skipped."
