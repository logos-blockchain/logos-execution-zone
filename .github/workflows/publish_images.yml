name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  ci-image:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-image.yml

  advisories:
    needs: ci-image
    # Tags only: a dispatch is the way out before triage can land.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check licenses, bans, sources and advisories
        run: cargo deny --locked check

  # Pushed, not just loaded: the docker-container builder resolves named
  # contexts from the registry rather than the host image store.
  risc0_base:
    needs: advisories
    # Allow by what passed: a timeout reports `cancelled`, not `failure`.
    if: >-
      ${{ !cancelled()
      && (needs.advisories.result == 'success'
      || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push risc0 base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./lez/docker/risc0-base.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}/risc0_base:sha-${{ github.sha }}
          cache-from: type=gha,scope=risc0-base
          cache-to: type=gha,mode=min,scope=risc0-base

  publish:
    needs: risc0_base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sequencer_service
            dockerfile: ./lez/sequencer/service/Dockerfile
            build_args: |
              STANDALONE=false
          - name: sequencer_service-standalone
            dockerfile: ./lez/sequencer/service/Dockerfile
            build_args: |
              STANDALONE=true
          - name: sequencer_service-mdns
            dockerfile: ./lez/sequencer/service/Dockerfile
            build_args: |
              FEATURES=prove,mdns
          - name: indexer_service
            dockerfile: ./lez/indexer/service/Dockerfile
            build_args: ""
          - name: explorer_service
            dockerfile: ./lez/explorer_service/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          build-contexts: risc0_base=docker-image://${{ secrets.DOCKER_REGISTRY }}/${{ github.repository }}/risc0_base:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
