# Override for the REFUSED variant: zone B loads a config whose peer authorizes
# NO routes, so its watcher drops the bridge_lock -> wrapped_token message and
# nothing is minted on B. The lock still lands on zone A.
#
#   docker compose -f docker-compose.yml -f docker-compose.unauthorized.yml up
#
# prepare.sh also stamps the fresh channel ids into sequencer_b_unauthorized.json.
services:
  sequencer_b:
    volumes:
      - ./configs/sequencer_b_unauthorized.json:/etc/sequencer_service/sequencer_config.json:ro
