<div style="overflow-x:auto;margin:1.2em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 296" width="528" height="296" style="display:block;max-width:none" role="img" aria-label="Escrow: private buyer and seller">
<title>Escrow: private buyer and seller</title>
<text x="12" y="22" font-size="15" font-weight="bold" text-anchor="start" style="fill:var(--fg, #333);font-family:inherit">Escrow: private buyer and seller</text>
<text x="12" y="42" font-size="12" font-weight="normal" text-anchor="start" style="fill:rgba(128,128,128,0.95);font-family:inherit">The deal holds only addresses. Each party speaks through a seat.</text>
<rect x="12" y="104" width="504" height="60" rx="8" style="fill:rgba(79,134,198,0.07)"/>
<text x="20" y="117" font-size="10" font-weight="bold" text-anchor="start" style="fill:#4f86c6;font-family:inherit">HIDDEN</text>
<rect x="12" y="194" width="504" height="90" rx="8" style="fill:rgba(217,145,43,0.07)"/>
<text x="20" y="207" font-size="10" font-weight="bold" text-anchor="start" style="fill:#d9912b;font-family:inherit">ON CHAIN</text>
<text x="92" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Open</text>
<text x="92" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">the buyer</text>
<rect x="12" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="92" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">who the buyer is</text>
<line x1="92.0" y1="167" x2="92.0" y2="184" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="87.0,183 97.0,183 92.0,191" style="fill:#4f86c6"/>
<rect x="12" y="220" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="92" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">deal: three addresses</text>
<rect x="12" y="250" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="92" y="266" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">deal funded: 50</text>
<text x="264" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Release</text>
<text x="264" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">the buyer</text>
<rect x="184" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="264" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">who the buyer is</text>
<line x1="264.0" y1="167" x2="264.0" y2="184" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="259.0,183 269.0,183 264.0,191" style="fill:#4f86c6"/>
<rect x="184" y="220" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="264" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">buyer&#x27;s seat: release</text>
<rect x="184" y="250" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="264" y="266" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">credit 50, stored</text>
<text x="436" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Collect</text>
<text x="436" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">the seller</text>
<rect x="356" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="436" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">who the seller is</text>
<line x1="436.0" y1="167" x2="436.0" y2="184" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="431.0,183 441.0,183 436.0,191" style="fill:#4f86c6"/>
<rect x="356" y="220" width="160" height="24" rx="12" style="fill:none;stroke:rgba(128,128,128,0.95);stroke-dasharray:3,3"/>
<text x="436" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">only unlinkable notes</text>
</svg>
</div>
