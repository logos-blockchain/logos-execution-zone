[book]
title = "LEZ Program Development"
description = "A developer manual for writing programs on the Logos Execution Zone: the execution model, the privacy model and its limits, design patterns for uniform public/private interoperability, and a catalog of program designs."
authors = ["Logos Execution Zone contributors"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/logos-blockchain/logos-execution-zone"
fold = { enable = true, level = 1 }

[output.html.search]
limit-results = 30
