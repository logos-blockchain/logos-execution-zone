<line x1="264.0" y1="227" x2="264.0" y2="244" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="259.0,243 269.0,243 264.0,251" style="fill:#4f86c6"/>
<rect x="184" y="280" width="160" height="24" rx="12" style="fill:none;stroke:rgba(128,128,128,0.95);stroke-dasharray:3,3"/>
<text x="264" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">only unlinkable notes</text>
<text x="436" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Execute</text>
