<text x="20" y="267" font-size="10" font-weight="bold" text-anchor="start" style="fill:#d9912b;font-family:inherit">ON CHAIN</text>
<text x="92" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Propose</text>
<text x="92" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">Alice</text>
