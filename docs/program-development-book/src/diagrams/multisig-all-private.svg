<text x="92" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">pay Dave 100</text>
<line x1="92.0" y1="227" x2="92.0" y2="244" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="87.0,243 97.0,243 92.0,251" style="fill:#4f86c6"/>
<rect x="12" y="280" width="160" height="24" rx="12" style="fill:none;stroke:rgba(128,128,128,0.95);stroke-dasharray:3,3"/>
