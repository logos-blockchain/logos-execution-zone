<line x1="436.0" y1="227" x2="436.0" y2="244" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="431.0,243 441.0,243 436.0,251" style="fill:#4f86c6"/>
<rect x="356" y="280" width="160" height="24" rx="12" style="fill:none;stroke:rgba(128,128,128,0.95);stroke-dasharray:3,3"/>
<text x="436" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">only unlinkable notes</text>
<text x="608" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Dock</text>
<text x="608" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">a ship</text>
<rect x="528" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="608" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">which ship</text>
<rect x="528" y="160" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="608" y="176" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">its cargo</text>
<line x1="608.0" y1="227" x2="608.0" y2="244" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="603.0,243 613.0,243 608.0,251" style="fill:#4f86c6"/>
<rect x="528" y="280" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="608" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">a ship docked</text>
<rect x="528" y="310" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="608" y="326" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">at station 4</text>
