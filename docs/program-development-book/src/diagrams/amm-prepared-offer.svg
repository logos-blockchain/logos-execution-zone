<div style="overflow-x:auto;margin:1.2em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 266" width="528" height="266" style="display:block;max-width:none" role="img" aria-label="AMM: a prepared private offer">
<title>AMM: a prepared private offer</title>
<text x="12" y="22" font-size="15" font-weight="bold" text-anchor="start" style="fill:var(--fg, #333);font-family:inherit">AMM: a prepared private offer</text>
<text x="12" y="42" font-size="12" font-weight="normal" text-anchor="start" style="fill:rgba(128,128,128,0.95);font-family:inherit">Offer: pay 100 A, receive exactly 75 B. Proven once, settled later.</text>
<rect x="12" y="104" width="504" height="60" rx="8" style="fill:rgba(79,134,198,0.07)"/>
<text x="20" y="117" font-size="10" font-weight="bold" text-anchor="start" style="fill:#4f86c6;font-family:inherit">HIDDEN</text>
<rect x="12" y="194" width="504" height="60" rx="8" style="fill:rgba(217,145,43,0.07)"/>
<text x="20" y="207" font-size="10" font-weight="bold" text-anchor="start" style="fill:#d9912b;font-family:inherit">ON CHAIN</text>
<text x="92" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Prove</text>
<text x="92" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-family:inherit">trader</text>
<rect x="12" y="130" width="160" height="24" rx="12" style="fill:rgba(128,128,128,0.10);stroke:rgba(128,128,128,0.95);stroke-width:1.1"/>
<text x="92" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">the offer</text>
<text x="92" y="183" font-size="11" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">no transaction</text>
<text x="92" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">nothing</text>
<text x="264" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Settle</text>
<text x="264" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">price still fine</text>
<rect x="184" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="264" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">trader</text>
<line x1="264.0" y1="167" x2="264.0" y2="184" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="259.0,183 269.0,183 264.0,191" style="fill:#4f86c6"/>
<rect x="184" y="220" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="264" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">pool: 100 A in, 75 B out</text>
<text x="436" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Settle</text>
<text x="436" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#c9504a;font-family:inherit">price moved</text>
<rect x="356" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="436" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">note still unspent</text>
<line x1="436.0" y1="167" x2="436.0" y2="184" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="431.0,183 441.0,183 436.0,191" style="fill:#4f86c6"/>
<rect x="356" y="220" width="160" height="24" rx="12" style="fill:rgba(201,80,74,0.12);stroke:#c9504a;stroke-width:1.1"/>
<text x="436" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">refused, no change</text>
</svg>
</div>
