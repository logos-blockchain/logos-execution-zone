<div style="overflow-x:auto;margin:1.2em 0">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 356" width="700" height="356" style="display:block;max-width:none" role="img" aria-label="A payment channel: private recipient">
<title>A payment channel: private recipient</title>
<text x="12" y="22" font-size="15" font-weight="bold" text-anchor="start" style="fill:var(--fg, #333);font-family:inherit">A payment channel: private recipient</text>
<text x="12" y="42" font-size="12" font-weight="normal" text-anchor="start" style="fill:rgba(128,128,128,0.95);font-family:inherit">The recipient redeems for themselves, into a fresh private slot.</text>
<rect x="12" y="104" width="676" height="120" rx="8" style="fill:rgba(79,134,198,0.07)"/>
<text x="20" y="117" font-size="10" font-weight="bold" text-anchor="start" style="fill:#4f86c6;font-family:inherit">HIDDEN</text>
<rect x="12" y="254" width="676" height="90" rx="8" style="fill:rgba(217,145,43,0.07)"/>
<text x="20" y="267" font-size="10" font-weight="bold" text-anchor="start" style="fill:#d9912b;font-family:inherit">ON CHAIN</text>
<text x="92" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Open</text>
<text x="92" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#d9912b;font-family:inherit">payer</text>
<text x="92" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">nothing</text>
<line x1="92.0" y1="227" x2="92.0" y2="244" style="stroke:#d9912b;stroke-width:1.8;stroke-dasharray:none"/>
<polygon points="87.0,243 97.0,243 92.0,251" style="fill:#d9912b"/>
<rect x="12" y="280" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="92" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">vault +100</text>
<rect x="12" y="310" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="92" y="326" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">recipient: a gate</text>
<text x="264" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Pay, many times</text>
<text x="264" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-family:inherit">payer to recipient</text>
<rect x="184" y="130" width="160" height="24" rx="12" style="fill:rgba(128,128,128,0.10);stroke:rgba(128,128,128,0.95);stroke-width:1.1"/>
<text x="264" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">voucher: total 1</text>
<rect x="184" y="160" width="160" height="24" rx="12" style="fill:rgba(128,128,128,0.10);stroke:rgba(128,128,128,0.95);stroke-width:1.1"/>
<text x="264" y="176" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">voucher: total 2</text>
<rect x="184" y="190" width="160" height="24" rx="12" style="fill:rgba(128,128,128,0.10);stroke:rgba(128,128,128,0.95);stroke-width:1.1"/>
<text x="264" y="206" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">... total 64</text>
<text x="264" y="243" font-size="11" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">no transaction</text>
<text x="264" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">nothing</text>
<text x="436" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Redeem</text>
<text x="436" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">recipient</text>
<rect x="356" y="130" width="160" height="24" rx="12" style="fill:rgba(79,134,198,0.18);stroke:#4f86c6;stroke-width:1.1"/>
<text x="436" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">recipient</text>
<line x1="436.0" y1="227" x2="436.0" y2="244" style="stroke:#4f86c6;stroke-width:1.8;stroke-dasharray:5,4"/>
<polygon points="431.0,243 441.0,243 436.0,251" style="fill:#4f86c6"/>
<rect x="356" y="280" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="436" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">voucher: total 64</text>
<rect x="356" y="310" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="436" y="326" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">vault -64</text>
<text x="608" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Close</text>
<text x="608" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#d9912b;font-family:inherit">payer, after expiry</text>
<text x="608" y="146" font-size="12" font-weight="normal" text-anchor="middle" style="fill:rgba(128,128,128,0.95);font-style:italic;font-family:inherit">nothing</text>
<line x1="608.0" y1="227" x2="608.0" y2="244" style="stroke:#d9912b;stroke-width:1.8;stroke-dasharray:none"/>
<polygon points="603.0,243 613.0,243 608.0,251" style="fill:#d9912b"/>
<rect x="528" y="280" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="608" y="296" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">rest back to payer</text>
</svg>
</div>
