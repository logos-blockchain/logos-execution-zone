<rect x="12" y="220" width="160" height="24" rx="12" style="fill:rgba(217,145,43,0.20);stroke:#d9912b;stroke-width:1.1"/>
<text x="92" y="236" font-size="12" font-weight="normal" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">swap program named</text>
<text x="264" y="74" font-size="13" font-weight="bold" text-anchor="middle" style="fill:var(--fg, #333);font-family:inherit">Accept</text>
<text x="264" y="92" font-size="12" font-weight="normal" text-anchor="middle" style="fill:#4f86c6;font-family:inherit">Bob</text>
