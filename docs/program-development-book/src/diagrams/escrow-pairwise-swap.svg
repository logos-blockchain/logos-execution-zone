<text x="12" y="22" font-size="15" font-weight="bold" text-anchor="start" style="fill:var(--fg, #333);font-family:inherit">Two-party private swap</text>
<text x="12" y="42" font-size="12" font-weight="normal" text-anchor="start" style="fill:rgba(128,128,128,0.95);font-family:inherit">Both legs held on one private PDA under a shared pairwise key.</text>
