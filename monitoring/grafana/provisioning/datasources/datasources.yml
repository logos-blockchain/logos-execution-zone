apiVersion: 1

# `$$` is a literal `$`: Grafana expands environment variables in this file.

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Must match prometheus.yml's `scrape_interval`
      timeInterval: 5s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Alloy puts a line's trace id in its `trace_id` structured metadata.
      derivedFields:
        - name: Trace
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: $${__value.raw}
          urlDisplayLabel: Show trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      nodeGraph:
        enabled: true
      # From a span to the lines logged in its trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
