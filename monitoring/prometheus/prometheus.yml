global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sequencer
    metrics_path: /metrics
    static_configs:
      # The four-node devnet, each node's exporter published on its own port.
      - targets:
          - host.docker.internal:9000
          - host.docker.internal:9001
          - host.docker.internal:9002
          - host.docker.internal:9003
