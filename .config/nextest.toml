# Timing visibility for CI. There is deliberately no `terminate-after`: some
# tests legitimately run for many minutes, and the point here is to see which
# ones, not to kill them.
[profile.ci]
# Print a SLOW line every period a test is still running, so the expensive
# tests show up in the job log.
slow-timeout = { period = "120s" }
# One failing test should not hide the timings of the rest.
fail-fast = false
status-level = "slow"

# Each slashing test runs a Bedrock node and three sequencers, so they run one at a time.
# The any-program tests deploy a guest through the loader before their delivery,
# so they hold a node for several finality-bound minutes too. They live as modules
# of their binary, so they match by name rather than by binary.
[test-groups]
slashing = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(slashing) + test(/^any_program::/) + test(/^system_upgrade::/)'
test-group = 'slashing'
