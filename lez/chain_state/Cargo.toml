[package]
name = "chain_state"
version = "0.1.0"
edition = "2024"
license = { workspace = true }

[lints]
workspace = true

[dependencies]
clock_core.workspace = true
common.workspace = true
fee_core.workspace = true
lee.workspace = true
lee_core = { workspace = true, features = ["host"] }
programs.workspace = true
sequencer_stake_core.workspace = true
system_accounts.workspace = true
logos-blockchain-core = { workspace = true, optional = true }
logos-blockchain-zone-sdk = { workspace = true, optional = true }

anyhow.workspace = true
async-trait = { workspace = true, optional = true }
borsh.workspace = true
futures = { workspace = true, optional = true }
hex.workspace = true
tracing.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["node"]
# Off in the STF prototype guest.
node = [
  "common/node",
  "dep:logos-blockchain-core",
  "dep:logos-blockchain-zone-sdk",
  "dep:async-trait",
  "dep:futures",
  "dep:tokio",
]
# In-process guest execution with a memoized memory image, via `lee`.
prove = ["lee/prove"]
# Mutable access to the head state, for other crates' tests.
test-utils = []

[dev-dependencies]
program_loader_core.workspace = true
system_upgrader_core.workspace = true
lee = { workspace = true, features = ["test-utils"] }
testnet_initial_state.workspace = true
serde_json.workspace = true
test_methods.workspace = true
test_guest_core.workspace = true
async-trait.workspace = true
