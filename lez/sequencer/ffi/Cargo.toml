[package]
edition = "2024"
license = { workspace = true }
name = "sequencer_ffi"
version = "0.1.0"

[dependencies]
lee.workspace = true
sequencer_core = { workspace = true, features = ["testnet"] }
sequencer_storage_actor.workspace = true
sequencer_executor_actor.workspace = true

env_logger.workspace = true
log = { workspace = true }
tokio = { features = ["rt-multi-thread"], workspace = true }
futures.workspace = true
serde_json.workspace = true
kameo.workspace = true
kameo_actors.workspace = true
anyhow.workspace = true

[build-dependencies]
cbindgen = "0.29"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
name = "sequencer_ffi"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = [
  "cbindgen",
] # machete does not recognize this for build dep and complains.