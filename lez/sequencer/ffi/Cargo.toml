[package]
edition = "2024"
license = { workspace = true }
name = "sequencer_ffi"
version = "0.1.0"

[dependencies]
lee.workspace = true
lee_core.workspace = true
sequencer_core = { workspace = true }
sequencer_service.workspace = true
sequencer_storage_actor = { workspace = true, features = ["actor"] }
sequencer_executor_actor = { workspace = true, features = ["actor"] }
sequencer_bedrock_actor = { workspace = true, features = ["actor"] }
sequencer_slasher_actor.workspace = true
sequencer_channel_config_actor.workspace = true
common.workspace = true

env_logger.workspace = true
log = { workspace = true }
tokio = { features = ["rt-multi-thread"], workspace = true }
serde_json.workspace = true
kameo.workspace = true
kameo_actors.workspace = true
anyhow.workspace = true
glob.workspace = true

[build-dependencies]
cbindgen.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]
name = "sequencer_ffi"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = [
  "cbindgen",
] # machete does not recognize this for build dep and complains.
