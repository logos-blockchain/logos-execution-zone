[package]
name = "sequencer_executor_actor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Adds actor implementation.
actor = [
  "dep:sequencer_executor_actor_metrics",
  "dep:sharding_pool_actor",
  "dep:lee",
  "dep:sequencer_core",
  "dep:sequencer_core_metrics",
  "dep:sequencer_stake_core",
  "dep:mempool",
  "dep:testnet_initial_state",
  "dep:cross_zone",
  "dep:programs",
  "dep:system_accounts",
  "dep:fee_core",
  "dep:bridge_core",

  "dep:tokio",
  "dep:futures",
  "dep:kameo_actors",
  "dep:log",
  "dep:hex",
]
# Adds mock actor implementation.
mock = ["sequencer_actors_common/mock", "dep:mockall"]

[dependencies]
common.workspace = true
lee_core.workspace = true
sequencer_actors_common.workspace = true
sequencer_slasher_actor.workspace = true
sequencer_storage_actor.workspace = true
sequencer_bedrock_actor.workspace = true
chain_state.workspace = true
sequencer_executor_actor_metrics = { workspace = true, features = [
  "record",
], optional = true }
sharding_pool_actor = { workspace = true, features = [
  "actor",
], optional = true }
lee = { workspace = true, optional = true }
sequencer_core = { workspace = true, optional = true }
# TODO: Don't import that
sequencer_core_metrics = { workspace = true, features = [
  "record",
], optional = true }
sequencer_stake_core = { workspace = true, optional = true }
mempool = { workspace = true, optional = true }
testnet_initial_state = { workspace = true, optional = true }
cross_zone = { workspace = true, optional = true }
system_accounts = { workspace = true, optional = true }
programs = { workspace = true, optional = true }
fee_core = { workspace = true, optional = true }
bridge_core = { workspace = true, optional = true }

kameo.workspace = true
anyhow.workspace = true
thiserror.workspace = true
num-traits.workspace = true
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
kameo_actors = { workspace = true, optional = true }
log = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }

