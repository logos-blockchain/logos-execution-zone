[package]
name = "sequencer_executor_actor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Adds actor implementation.
actor = [
  "dep:sequencer_executor_actor_metrics",
  "dep:lee",
  "dep:sequencer_core",
  "dep:mempool",

  "dep:tokio",
  "dep:futures",
  "dep:log",
]
# Adds mock actor implementation.
mock = ["sequencer_actors_common/mock", "dep:mockall"]

[dependencies]
common.workspace = true
lee_core.workspace = true
sequencer_actors_common.workspace = true
sequencer_storage_actor.workspace = true
sequencer_bedrock_actor.workspace = true
sequencer_executor_actor_metrics = { workspace = true, features = [
  "record",
], optional = true }
lee = { workspace = true, optional = true }
sequencer_core = { workspace = true, optional = true }
mempool = { workspace = true, optional = true }

kameo.workspace = true
anyhow.workspace = true
thiserror.workspace = true
num-traits.workspace = true
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
log = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }

[dev-dependencies]
lee = { workspace = true, features = ["test-utils"] }
sequencer_storage_actor = { workspace = true, features = ["mock"] }
sequencer_bedrock_actor = { workspace = true, features = ["mock"] }
bridge_core.workspace = true
chain_state.workspace = true
cross_zone = { workspace = true, features = ["test-utils"] }
faucet_core.workspace = true
cross_zone_inbox_core.workspace = true
fee_core.workspace = true
ping_core.workspace = true
logos-blockchain-core.workspace = true
logos-blockchain-zone-sdk.workspace = true
serde_json.workspace = true
system_accounts.workspace = true
sequencer_stake_core.workspace = true
programs.workspace = true
test_programs.workspace = true
testnet_initial_state.workspace = true

env_logger.workspace = true
mockall.workspace = true
tempfile.workspace = true
bytesize.workspace = true
num-bigint.workspace = true
borsh.workspace = true
