[package]
name = "sequencer_gossip_actor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Adds actor implementation.
actor = [
  "dep:anyhow",
  "dep:borsh",
  "dep:futures",
  "dep:hex",
  "dep:kameo",
  "dep:libp2p",
  "dep:log",
  "dep:logos-blockchain-key-management-system-service",
  "dep:sequencer_channel_config_actor",
  "dep:sequencer_core",
  "dep:sequencer_slasher_actor",
  "dep:tokio",
]
# Enable mDNS-based local peer discovery for gossip.
# All mDNS code lives in the actor, so this implies `actor`.
mdns = ["actor"]

[dependencies]
common.workspace = true
sequencer_channel_config_actor = { workspace = true, optional = true }
sequencer_core = { workspace = true, optional = true }
sequencer_slasher_actor = { workspace = true, optional = true }

logos-blockchain-key-management-system-service = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
borsh = { workspace = true, optional = true }
kameo = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "time",
], optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
libp2p = { workspace = true, optional = true }

[dev-dependencies]
lee = { workspace = true, features = ["test-utils"] }
logos-blockchain-core.workspace = true
mempool.workspace = true
sequencer_stake_core.workspace = true
testnet_initial_state.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
