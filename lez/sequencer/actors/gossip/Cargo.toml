[package]
name = "sequencer_gossip_actor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Adds actor implementation.
actor = ["dep:tokio", "dep:futures", "dep:hex", "dep:libp2p"]
# Enable mDNS-based local peer discovery for gossip.
mdns = []

[dependencies]
common.workspace = true
sequencer_core.workspace = true

logos-blockchain-core.workspace = true
logos-blockchain-key-management-system-service.workspace = true
logos-blockchain-zone-sdk.workspace = true

anyhow.workspace = true
borsh.workspace = true
kameo.workspace = true
log.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "time",
], optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
libp2p = { workspace = true, optional = true }

[dev-dependencies]
lee = { workspace = true, features = ["test-utils"] }
mempool.workspace = true
testnet_initial_state.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
