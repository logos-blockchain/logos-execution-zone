[package]
name = "sequencer_storage_actor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Adds actor implementation.
actor = ["dep:rocksdb", "dep:zstd"]
# Adds mock actor implementation.
mock = ["sequencer_actors_common/mock", "dep:mockall"]

[dependencies]
sequencer_actors_common.workspace = true
sequencer_storage_actor_derive.workspace = true

kameo.workspace = true
thiserror.workspace = true
borsh = { workspace = true, features = ["derive"] }
num-traits.workspace = true
trait-set.workspace = true
rocksdb = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
