[package]
name = "sequencer_bedrock_actor"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lints]
workspace = true

[features]
# Adds actor implementation using kameo_actors.
actor = [
  "dep:kameo_actors",
  "dep:tokio",
  "dep:borsh",
  "dep:url",
  "dep:tracing",
  "dep:vault_circuit",
  "dep:bridge_core",
  "dep:logos-blockchain-program-spend",
  "dep:logos-blockchain-mmr",
  "dep:rand",
]
# Adds mock actor implementation.
mock = ["sequencer_actors_common/mock", "dep:mockall"]
test-utils = []

[dependencies]
chain_state.workspace = true
common.workspace = true
sequencer_stake_core.workspace = true
sequencer_actors_common.workspace = true
sequencer_storage_actor.workspace = true
sharding_pool_actor.workspace = true

logos-blockchain-zone-sdk.workspace = true
kameo.workspace = true
thiserror.workspace = true
anyhow.workspace = true
futures.workspace = true
kameo_actors = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
borsh = { workspace = true, optional = true }
url = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }
vault_circuit = { workspace = true, optional = true }
bridge_core = { workspace = true, features = ["host"], optional = true }
logos-blockchain-program-spend = { workspace = true, optional = true }
logos-blockchain-mmr = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
lee.workspace = true
logos-blockchain-core = { workspace = true, features = ["test-utils"] }
glob.workspace = true
tokio = { workspace = true, features = ["macros", "test-util"] }
