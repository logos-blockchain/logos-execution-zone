[package]
name = "sequencer_service"
version = "0.1.0"
default-run = "sequencer_service"
edition = "2024"
license = { workspace = true }

[lints]
workspace = true

[dependencies]
sequencer_core.workspace = true
sequencer_channel_config_actor.workspace = true
sequencer_gossip_actor = { workspace = true, features = ["actor"] }
sequencer_rpc_server_actor = { workspace = true, optional = true }
sequencer_executor_actor = { workspace = true, features = ["actor"] }
sequencer_slasher_actor.workspace = true
sequencer_storage_actor = { workspace = true, features = ["actor"] }
sequencer_bedrock_actor = { workspace = true, features = ["actor"] }
lee.workspace = true
common.workspace = true
borsh = { workspace = true, optional = true }
programs.workspace = true
system_accounts.workspace = true
wallet.workspace = true
sequencer_stake_core.workspace = true

clap = { workspace = true, features = ["derive", "env"] }
anyhow.workspace = true
env_logger.workspace = true
kameo.workspace = true
kameo_actors.workspace = true
hex.workspace = true
log.workspace = true
metrics-exporter-prometheus.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
glob.workspace = true
serde_json.workspace = true

[[bin]]
name = "sequencer_service"
path = "src/main.rs"
required-features = ["rpc"]

[[bin]]
name = "inscribe_garbage"
path = "src/bin/inscribe_garbage.rs"
required-features = ["inscribe_garbage"]

[features]
default = ["rpc"]
# Serves the sequencer over the JSON-RPC API. Off for embedders that hold a
# `SequencerHandle` and talk to the executor directly.
rpc = ["dep:sequencer_rpc_server_actor"]
# In-process guest execution with a memoized memory image, via `lee`.
prove = ["sequencer_core/prove"]
# Runs the sequencer in standalone mode without depending on Bedrock.
standalone = ["sequencer_bedrock_actor/mock"]
# Enable mDNS-based local peer discovery for gossip.
mdns = ["sequencer_gossip_actor/mdns"]
# Needed only by the inscribe_garbage bin. Never in a release build.
inscribe_garbage = [
  "sequencer_storage_actor/mock",
  "sequencer_bedrock_actor/test-utils",
  "dep:borsh",
]
